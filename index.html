<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Primary Meta Tags (Yeh Google Search mein Title aur Description dikhayega) -->
  <title>Bite And Burp | Advanced POS Ecosystem for Restaurants</title>
  <meta name="title" content="Bite And Burp | Advanced POS Ecosystem for Restaurants">
  <meta name="description" content="Run your restaurant like a masterpiece. The all-in-one POS ecosystem for billing, smart inventory, waiter KOTs, and contactless QR ordering.">
  <meta name="keywords" content="Restaurant POS, Billing Software, KOT, Smart Inventory, Restaurant Management, Bite and Burp, Cafe POS">

  <!-- Open Graph / WhatsApp / Facebook (Share karne par Card aur Logo kaisa dikhega) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://biteandburp.com/">
  <meta property="og:title" content="Bite And Burp | Advanced POS Ecosystem">
  <meta property="og:description" content="The all-in-one POS ecosystem for billing, smart inventory, and KOTs. Stop managing multiple tools.">
  <meta property="og:image" content="https://biteandburp.com/assets/images/Logo.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://biteandburp.com/">
  <meta property="twitter:title" content="Bite And Burp | Advanced POS Ecosystem">
  <meta property="twitter:description" content="The all-in-one POS ecosystem for billing, smart inventory, and KOTs. Stop managing multiple tools.">
  <meta property="twitter:image" content="https://biteandburp.com/assets/images/Logo.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bite & Burp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon (Yeh Google Search tab mein chota sa Logo dikhayega) -->
  <link rel="icon" type="image/png" href="assets/images/Logo.png"/>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
